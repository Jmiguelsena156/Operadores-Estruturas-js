<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores e estruturas de fluxo de controle</title>
</head>
<body>
    <h1>Questão 2</h1>
    <script>
        let pontos = 0;
        console.log("Início: " + pontos);

        pontos += 10;
        console.log("Após += 10: " + pontos); 
        pontos += 25;
        console.log("Após += 25: " + pontos);
        pontos -= 5;
        console.log("Após -= 5:  " + pontos);
        pontos++;
        console.log("Após ++:    " + pontos);
    </script>
</body>
</html>
