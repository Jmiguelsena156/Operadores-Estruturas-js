<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores e estruturas de fluxo de controle</title>
</head>
<body>
    <h1>Questão 6</h1>
    <script>
        let temperatura = Number(prompt("Informe a temperatura do seu ambiente: "));

        if (temperatura < 15) {
            console.log(temperatura.toFixed() + "graus - clima: Frio");
        } else if (temperatura <= 25) {
            console.log(temperatura.toFixed() + "graus - clima: Amena");
        } else {
            console.log(temperatura.toFixed() + "graus - clima: Quente");
        }
    </script>
</body>
</html>
