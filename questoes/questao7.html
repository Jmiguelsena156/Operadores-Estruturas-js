<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores e estruturas de fluxo de controle</title>
</head>
<body>
    <h1>Questão 7</h1>
    <script>
        let turno = parseInt(prompt("Informe um numero de 1 a 3: "));

        switch (turno) {
            case 1:
                console.log("Turno: Manhã");
                break;
            case 2:
                console.log("Turno: Tarde");
                break;
            case 3:
                console.log("Turno: Noite");
                break;
            default:
                console.log("Turno inválido")
        }
    </script>
</body>
</html>
