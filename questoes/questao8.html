<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores e estruturas de fluxo de controle</title>
</head>
<body>
    <h1>Questão 8</h1>
    <script>
        const num = parseInt(prompt("Informe um número inteiro positivo: "));

        console.log("Tabuada do " + num);
        for (let k  = 1; k <= 10; k++) {
            console.log(num + " x " + k + " = " + (num*k));
        }
    </script>
</body>
</html>
